[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-scan"
version = "0.1.0"
authors = [
  { name = "Jonny Rodin", email = "thejedi433@outlook.com" }
]
description = "Scan source files for TODO/FIXME/HACK comments"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
todo-scan = "todo_scan.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["todo_scan"]
omit = ["src/todo_scan/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "from todo_scan.cli import main",
    "main()",
]
